<!DOCTYPE html>
<html>
<head>

  <style>
    body {
      margin: 0;
      background: #1a1a2e;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #plugin-container {
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .placeholder {
      padding: 24px;
      color: #888;
      text-align: center;

      display: block;
      margin-bottom: 8px;
      font-size: 16px;
    }

</head>
<body>
  <div id="plugin-container">
    <div class="placeholder">
      <strong>Plugin UI</strong>
      Native plugin UI renders here.<br>
      Attach via IVst3Adapter.attachEditor()
    </div>
  </div>

</html>
